<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HymnPilot</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #5f6368; --accent: #6b4fbb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #ececec; --muted: #a0a0a0; --accent: #a991f0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.9em; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>HymnPilot</h1>
  <p>Learn to sing your part of any hymn, note by note, in do-re-mi.</p>
  <p><a href="https://play.google.com/apps/testing/com.hymnpilot.app">Join the Android test</a></p>
  <p><a href="privacy.html">Privacy policy</a></p>
  <p class="muted">Questions: <a href="mailto:info@playdunkball.com">info@playdunkball.com</a></p>
</main>
</body>
</html>
